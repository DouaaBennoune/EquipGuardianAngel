version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.Backend
    container_name: equip-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./pkls:/app/pkls 
      - ./app:/app/app
   
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: equip-frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend
    volumes:
      - .:/app
  
    restart: always
